<div class="login-container">
  <div class="login-header">
    <h1>Accedi</h1>
    <p class="subtitle">Inserisci le tue credenziali per accedere</p>
  </div>
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        placeholder="esempio@email.com" 
        [class.invalid]="email?.invalid && email?.touched"
      />
      <span class="error-message" *ngIf="email?.invalid && email?.touched">
        <span *ngIf="email?.errors?.['required']">Email richiesta</span>
        <span *ngIf="email?.errors?.['email']">Email non valida</span>
      </span>
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password" 
        placeholder="Inserisci la tua password"
        [class.invalid]="password?.invalid && password?.touched"
      />
      <span class="error-message" *ngIf="password?.invalid && password?.touched">
        <span *ngIf="password?.errors?.['required']">Password richiesta</span>
        <span *ngIf="password?.errors?.['minlength']">Minimo 6 caratteri</span>
      </span>
    </div>
    
    <button type="submit" [disabled]="loading" class="login-button">
      <span *ngIf="!loading">Accedi</span>
      <span *ngIf="loading">Accesso in corso...</span>
    </button>
  </form>
  
  <div class="login-footer">
    <p *ngIf="errorMessage" class="error alert">{{ errorMessage }}</p>
  </div>
</div>
